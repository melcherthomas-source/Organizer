name: Windows EXE bauen

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Werkstatt-Todo-Windows
          path: dist/*.exe
